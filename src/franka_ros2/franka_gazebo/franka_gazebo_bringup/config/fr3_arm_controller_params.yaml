fr3_arm_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      fr3_joint1: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
      fr3_joint2: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
      fr3_joint3: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
      fr3_joint4: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
      fr3_joint5: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
      fr3_joint6: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
      fr3_joint7: {p: 500.0, i: 0.0, d: 10.0, i_clamp: 1.0}
    allow_partial_joints_goal: false
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0